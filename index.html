<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#FAF9F6">
<meta name="supported-color-schemes" content="light">
<title>Briefing de Projeto — Calebe Andrade Arquiteto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Jost:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light only;
    --ink:#3E3833;
    --ink-2:#5B554E;
    --black:#211E1B;
    --paper:#FAF9F6;
    --paper-alt:#F1EEE8;
    --paper-alt-2:#E9E4DB;
    --line:#DAD4C9;
    --line-soft:#E7E2D9;
    --white:#FFFFFF;
    --ok:#4B5D45;
    --err:#8C4A3B;
    --radius:2px;
    --shadow:0 1px 2px rgba(33,30,27,.04), 0 8px 24px rgba(33,30,27,.05);
  }
  *{box-sizing:border-box;}
  html{background:var(--paper);color-scheme:light only;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Jost',sans-serif;
    font-weight:400;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  #app{min-height:100vh; display:flex; flex-direction:column;}
  img{max-width:100%;display:block;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea,select{font-family:inherit;}
  a{color:inherit;}
  ::selection{background:var(--ink);color:var(--paper);}

  .display{font-family:'Bodoni Moda',serif;}
  .eyebrow{
    font-family:'Jost',sans-serif;
    text-transform:uppercase;
    letter-spacing:.2em;
    font-size:.7rem;
    font-weight:500;
    color:var(--ink);
    opacity:.62;
  }
  .hairline{border:none;border-top:1px solid var(--line);margin:0;}
  .vhairline{border-left:1px solid var(--line);}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:.5em;
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    padding:.9em 1.6em;
    font-size:.85rem;
    letter-spacing:.06em;
    text-transform:uppercase;
    font-weight:500;
    border-radius:var(--radius);
    transition:background .15s ease, color .15s ease, opacity .15s ease, transform .1s ease;
  }
  .btn:hover{background:var(--black);}
  .btn:active{transform:translateY(1px);}
  .btn[disabled]{opacity:.35;cursor:not-allowed;}
  .btn-ghost{
    background:transparent;color:var(--ink);border:1px solid var(--ink);
  }
  .btn-ghost:hover{background:var(--ink);color:var(--paper);}
  .btn-text{
    background:transparent;border:none;color:var(--ink);
    text-transform:uppercase;letter-spacing:.14em;font-size:.72rem;font-weight:500;
    padding:.4em 0;border-bottom:1px solid var(--ink);border-radius:0;
    opacity:.75;
  }
  .btn-text:hover{opacity:1;}
  .btn-danger{border-color:var(--err);background:transparent;color:var(--err);}
  .btn-danger:hover{background:var(--err);color:var(--white);}
  .btn-sm{padding:.55em 1em;font-size:.72rem;}

  .field-label{
    display:block;font-size:.78rem;letter-spacing:.04em;color:var(--ink-2);margin-bottom:.5em;
  }
  select{background:var(--white);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius);}
  .text-input, .textarea-input{
    width:100%;
    border:1px solid var(--line);
    background:var(--white);
    padding:.85em 1em;
    font-size:1rem;
    color:var(--ink);
    border-radius:var(--radius);
    outline:none;
    transition:border-color .15s ease;
  }
  .text-input:focus, .textarea-input:focus{border-color:var(--ink);}
  .textarea-input{min-height:6.5em;resize:vertical;line-height:1.55;}

  /* ---------- LANDING ---------- */
  .landing{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:8vh 6vw 6vh;text-align:center;position:relative;
  }
  .landing .wordmark{max-width:320px;width:60vw;margin:0 auto 3.2em;opacity:.94;}
  .landing h1{
    font-size:clamp(2.1rem,4.4vw,3.4rem);font-weight:400;margin:0 0 .5em;line-height:1.08;
  }
  .landing p.lede{
    max-width:520px;color:var(--ink-2);font-size:1.02rem;line-height:1.7;margin:0 0 2.6em;
  }
  .cta-row{display:flex;flex-direction:column;align-items:center;gap:1.1em;}
  .admin-tuck{
    position:fixed;right:1.6em;bottom:1.4em;font-size:.7rem;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink-2);opacity:.55;text-decoration:none;
    border-bottom:1px solid transparent;background:none;border-top:none;border-left:none;border-right:none;
    padding:.4em 0;
  }
  .admin-tuck:hover{opacity:1;border-bottom-color:var(--ink-2);}

  /* ---------- WIZARD SHELL ---------- */
  .wizard-shell{flex:1;display:flex;min-height:100vh;}
  .rail{
    width:74px;flex:none;border-right:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;padding:2.2em 0;gap:0;
  }
  .rail .rail-logo{width:34px;margin-bottom:2.4em;opacity:.85;}
  .rail-steps{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;}
  .rail-step{
    position:relative;display:flex;flex-direction:column;align-items:center;
    padding:.55em 0;cursor:pointer;background:none;border:none;color:var(--ink);
  }
  .rail-step .num{
    font-family:'Bodoni Moda',serif;font-size:.82rem;color:var(--ink-2);opacity:.55;
    width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    border:1px solid transparent;
  }
  .rail-step.active .num{opacity:1;border-color:var(--ink);color:var(--ink);}
  .rail-step.done .num{opacity:.85;}
  .rail-step:not(.reachable){cursor:default;}
  .rail-line{width:1px;height:22px;background:var(--line);}
  .rail-step:disabled{cursor:default;}

  .mobile-progress{display:none;padding:1.1em 1.4em .9em;border-bottom:1px solid var(--line);}
  .mobile-progress .mp-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.6em;}
  .mobile-progress .mp-top .eyebrow{opacity:.7;}
  .mobile-progress .bar{height:2px;background:var(--line-soft);position:relative;}
  .mobile-progress .bar span{position:absolute;left:0;top:0;bottom:0;background:var(--ink);}

  .wizard-main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .wizard-scroll{flex:1;overflow-y:auto;padding:4.2vh 6vw 2vh;}
  .wizard-inner{max-width:660px;margin:0 auto;}
  .sheet-head{margin-bottom:2.2em;}
  .sheet-head .eyebrow{margin-bottom:.7em;}
  .sheet-head h2{font-size:clamp(1.6rem,3vw,2.2rem);font-weight:400;margin:0;}
  .sheet-help{color:var(--ink-2);font-size:.92rem;margin-top:.6em;line-height:1.6;}

  .qcard{padding:1.8em 0;border-top:1px solid var(--line-soft);}
  .qcard:first-child{border-top:none;padding-top:0;}
  .qcard .qlabel{
    display:flex;gap:.7em;align-items:baseline;font-size:1.05rem;margin-bottom:1em;color:var(--ink);
  }
  .qcard .qlabel .qn{font-family:'Bodoni Moda',serif;color:var(--ink-2);opacity:.55;font-size:.95rem;}
  .qcard .qlabel .req{color:var(--err);margin-left:.15em;}

  .chips{display:flex;flex-wrap:wrap;gap:.6em;}
  .chip{
    border:1px solid var(--line);background:var(--white);color:var(--ink);
    padding:.7em 1.1em;font-size:.9rem;border-radius:var(--radius);
    transition:all .12s ease;text-align:left;
  }
  .chip:hover{border-color:var(--ink-2);}
  .chip.selected{background:var(--ink);border-color:var(--ink);color:var(--paper);}

  .visual-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.9em;}
  .visual-card{
    border:1px solid var(--line);background:var(--white);border-radius:var(--radius);
    padding:1.3em 1em 1em;display:flex;flex-direction:column;align-items:center;gap:.8em;
    position:relative;transition:border-color .12s ease, background .12s ease;text-align:center;
  }
  .visual-card:hover{border-color:var(--ink-2);}
  .visual-card.selected{border:2px solid var(--ink);padding:1.25em .93em .93em;background:var(--paper-alt);}
  .visual-card .vicon{width:52px;height:52px;color:var(--ink);}
  .visual-card .vphoto{width:calc(100% + 2em);height:112px;object-fit:cover;display:block;margin:-1.3em -1em 0;border-radius:1px 1px 0 0;}
  .visual-card.selected .vphoto{width:calc(100% + 1.86em);margin:-1.25em -0.93em 0;}
  .visual-card .vlabel{font-size:.84rem;color:var(--ink);}
  .visual-card .vcheck{
    position:absolute;top:0;right:0;width:0;height:0;
    border-style:solid;border-width:0 22px 22px 0;border-color:transparent var(--ink) transparent transparent;
    opacity:0;
  }
  .visual-card.selected .vcheck{opacity:1;}
  .visual-card .vcheck svg{position:absolute;top:1px;right:-21px;width:9px;height:9px;}

  .swatch-stack{position:relative;width:70px;height:52px;}
  .swatch-stack div{position:absolute;width:34px;height:34px;border:1px solid rgba(0,0,0,.08);box-shadow:0 2px 6px rgba(33,30,27,.12);}
  .swatch-stack div:nth-child(1){left:0;top:14px;z-index:1;}
  .swatch-stack div:nth-child(2){left:18px;top:2px;z-index:2;}
  .swatch-stack div:nth-child(3){left:36px;top:16px;z-index:3;}

  .other-row{display:flex;align-items:center;gap:.8em;margin-top:.7em;flex-wrap:wrap;}
  .other-row .text-input{max-width:320px;}

  .grid-q{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  .grid-row{display:flex;align-items:center;border-top:1px solid var(--line-soft);}
  .grid-row:first-child{border-top:none;}
  .grid-row .grow-label{flex:1;padding:.9em 1.1em;font-size:.9rem;color:var(--ink-2);}
  .grid-row .grow-cells{display:flex;gap:.4em;padding:.7em 1.1em;}
  .grow-cell{
    width:38px;height:38px;border:1px solid var(--line);background:var(--white);
    font-size:.8rem;color:var(--ink);border-radius:50%;
  }
  .grow-cell.selected{background:var(--ink);border-color:var(--ink);color:var(--paper);}

  .wizard-nav{
    border-top:1px solid var(--line);padding:1.1em 6vw;display:flex;justify-content:space-between;align-items:center;gap:1em;
  }
  .wizard-nav .spacer{flex:1;}
  .nav-error{color:var(--err);font-size:.78rem;}

  .titleblock{
    border-top:1px solid var(--ink);background:var(--black);color:var(--paper-alt);
    padding:.85em 6vw;display:flex;gap:2em;align-items:center;font-size:.72rem;
    letter-spacing:.05em;text-transform:uppercase;
  }
  .titleblock .tb-mono{width:20px;opacity:.9;filter:invert(1) brightness(2);}
  .titleblock .tb-item{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .titleblock .tb-item b{color:var(--paper);font-weight:500;opacity:.95;}
  .titleblock .tb-item{opacity:.7;}
  .titleblock .spacer{flex:1;}

  /* ---------- REVIEW ---------- */
  .review-sheet{margin-bottom:2.4em;}
  .review-sheet .rs-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.9em;}
  .review-sheet .rs-head h3{font-size:1.15rem;font-weight:500;margin:0;font-family:'Bodoni Moda',serif;}
  .review-item{padding:.85em 0;border-top:1px solid var(--line-soft);}
  .review-item:first-child{border-top:none;}
  .review-item .ri-q{font-size:.78rem;color:var(--ink-2);margin-bottom:.3em;}
  .review-item .ri-a{font-size:.96rem;color:var(--ink);white-space:pre-wrap;line-height:1.55;}
  .review-item .ri-a.empty{color:var(--ink-2);opacity:.55;font-style:italic;}

  /* ---------- SUCCESS ---------- */
  .success{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6vh 6vw;}
  .success .smono{width:46px;margin-bottom:1.6em;opacity:.85;}
  .success h2{font-size:clamp(1.7rem,3.6vw,2.4rem);font-weight:400;margin:0 0 .6em;}
  .success p{color:var(--ink-2);max-width:440px;line-height:1.7;}

  /* ---------- ADMIN ---------- */
  .admin-topbar{
    border-bottom:1px solid var(--line);padding:1.1em 4vw;display:flex;align-items:center;gap:1.4em;
  }
  .admin-topbar .aw{width:130px;}
  .admin-topbar .spacer{flex:1;}
  .admin-body{flex:1;padding:3vh 4vw 6vh;max-width:960px;margin:0 auto;width:100%;}
  .admin-gate-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:6vh 6vw;}
  .admin-gate-card{width:100%;max-width:360px;text-align:center;}
  .admin-gate-card .aw{width:120px;margin:0 auto 2em;}
  .admin-gate-card h2{font-size:1.5rem;font-weight:400;margin:0 0 .4em;}
  .admin-gate-card p{color:var(--ink-2);font-size:.88rem;margin:0 0 1.6em;line-height:1.6;}
  .admin-gate-card form{display:flex;flex-direction:column;gap:.9em;}

  .toolbar{display:flex;gap:1em;align-items:center;margin-bottom:1.6em;flex-wrap:wrap;}
  .toolbar .text-input{max-width:280px;}
  .count-pill{font-size:.72rem;color:var(--ink-2);letter-spacing:.06em;text-transform:uppercase;}

  .sub-row{
    display:flex;align-items:center;gap:1.2em;padding:1em 0;border-top:1px solid var(--line-soft);
  }
  .sub-row:first-child{border-top:none;}
  .sub-row .sr-name{font-weight:500;font-size:.98rem;flex:2;min-width:0;}
  .sub-row .sr-name .sr-sub{display:block;font-size:.76rem;color:var(--ink-2);font-weight:400;margin-top:.15em;}
  .sub-row .sr-meta{flex:1;font-size:.82rem;color:var(--ink-2);}
  .sub-row .sr-date{flex:1;font-size:.82rem;color:var(--ink-2);}

  .empty-state{padding:5em 1em;text-align:center;color:var(--ink-2);}
  .empty-state .es-icon{width:40px;margin:0 auto 1.2em;opacity:.5;}

  .detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:1em;margin-bottom:2em;flex-wrap:wrap;}
  .detail-head h2{font-size:1.7rem;font-weight:400;margin:0 0 .3em;}
  .detail-head .dh-meta{color:var(--ink-2);font-size:.86rem;}
  .detail-actions{display:flex;gap:.6em;flex-wrap:wrap;}

  .editor-sheet{border:1px solid var(--line);border-radius:var(--radius);margin-bottom:1.4em;}
  .editor-sheet .es-head{
    display:flex;align-items:center;gap:.8em;padding:1em 1.2em;background:var(--paper-alt);cursor:pointer;
  }
  .editor-sheet .es-head input{border:none;background:transparent;font-family:'Bodoni Moda',serif;font-size:1.05rem;flex:1;padding:.2em;}
  .editor-sheet .es-head input:focus{outline:1px solid var(--line);}
  .editor-sheet .es-body{padding:1em 1.2em 1.4em;display:none;}
  .editor-sheet.open .es-body{display:block;}
  .editor-sheet .es-head .chevron{transition:transform .15s ease;opacity:.5;}
  .editor-sheet.open .es-head .chevron{transform:rotate(90deg);}

  .eq-card{border:1px solid var(--line-soft);border-radius:var(--radius);padding:1em 1.1em;margin-bottom:.8em;background:var(--white);}
  .eq-row{display:flex;gap:.7em;margin-bottom:.7em;flex-wrap:wrap;align-items:center;}
  .eq-row select{border:1px solid var(--line);padding:.5em .6em;border-radius:var(--radius);background:var(--white);color:var(--ink);font-size:.82rem;}
  .eq-row label.chk{display:flex;align-items:center;gap:.4em;font-size:.8rem;color:var(--ink-2);}
  .eq-foot{display:flex;justify-content:space-between;align-items:center;margin-top:.6em;}

  .add-panel{border:1px dashed var(--line);border-radius:var(--radius);padding:1em 1.1em;margin-top:.6em;}
  .add-panel .ap-row{display:flex;gap:.7em;flex-wrap:wrap;margin-bottom:.7em;}

  .toast{
    position:fixed;bottom:1.4em;left:50%;transform:translateX(-50%);
    background:var(--black);color:var(--paper);padding:.85em 1.4em;border-radius:var(--radius);
    font-size:.85rem;box-shadow:var(--shadow);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s ease;
  }
  .toast.show{opacity:1;}

  .storage-banner{
    border:1px solid var(--line);border-left:3px solid var(--ink-2);background:var(--paper-alt);
    padding:.9em 1.1em;font-size:.82rem;line-height:1.6;margin-bottom:1.6em;color:var(--ink);
  }
  .storage-banner.fail{border-left-color:var(--err);}
  .storage-banner .sb-detail{margin-top:.5em;font-size:.74rem;color:var(--ink-2);font-family:monospace;word-break:break-word;}

  .center-loading{flex:1;display:flex;align-items:center;justify-content:center;color:var(--ink-2);font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;}

  @media (max-width:900px){
    .rail{display:none;}
    .mobile-progress{display:block;}
    .titleblock{flex-wrap:wrap;row-gap:.3em;}
    .titleblock .tb-hide-mobile{display:none;}
  }
  @media (max-width:640px){
    .wizard-nav{padding:1em 5vw;}
    .visual-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));}
    .sub-row{flex-wrap:wrap;}
    .admin-topbar{padding:1em 5vw;}
    .admin-body{padding:3vh 5vw 6vh;}
  }
  @media print{
    .admin-topbar, .detail-actions, .toast{display:none !important;}
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
/* =========================================================
   Briefing de Projeto — Calebe Andrade Arquiteto

/* ---------------------------------------------------------
   Helpers gerais
--------------------------------------------------------- */
function uid(prefix){ return (prefix||'id') + '_' + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4); }
function escapeHtml(str){
  if(str===undefined||str===null) return '';
  return String(str).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function nl2br(str){ return escapeHtml(str).replace(/\n/g,'<br>'); }
function cloneDeep(obj){ return JSON.parse(JSON.stringify(obj)); }
function formatDate(ts){
  try{
    const d = new Date(ts);
    return d.toLocaleDateString('pt-BR', {day:'2-digit',month:'2-digit',year:'numeric'}) + ' às ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  }catch(e){ return ''; }
}
function formatDateShort(ts){
  try{
    const d = new Date(ts);
    return d.toLocaleDateString('pt-BR', {day:'2-digit',month:'2-digit',year:'numeric'});
  }catch(e){ return ''; }
}

let STORAGE_LAST_ERROR = null;

function storageApiPresent(){
  return typeof window.storage !== 'undefined' && window.storage !== null && typeof window.storage.set === 'function';
}
function sleep(ms){ return new Promise(function(res){ setTimeout(res, ms); }); }

async function storageGetSafe(key, shared){
  if(!storageApiPresent()){ STORAGE_LAST_ERROR = 'API de armazenamento indisponível neste contexto.'; return null; }
  let lastErr = null;
  for(let attempt=0; attempt<2; attempt++){
    try{
      const r = await window.storage.get(key, shared);
      STORAGE_LAST_ERROR = null;
      return r ? r.value : null;
    }catch(e){
      lastErr = (e && e.message) ? e.message : String(e);
      if(attempt===0) await sleep(700);
    }
  }
  STORAGE_LAST_ERROR = lastErr;
  return null;
}
async function storageSetSafe(key, value, shared){
  if(!storageApiPresent()){ STORAGE_LAST_ERROR = 'API de armazenamento indisponível neste contexto.'; return false; }
  let lastErr = null;
  for(let attempt=0; attempt<2; attempt++){
    try{
      const r = await window.storage.set(key, value, shared);
      if(r){ STORAGE_LAST_ERROR = null; return true; }
      lastErr = 'A gravação retornou vazio (sem lançar erro).';
    }catch(e){
      lastErr = (e && e.message) ? e.message : String(e);
    }
    if(attempt===0) await sleep(700);
  }
  STORAGE_LAST_ERROR = lastErr;
  return false;
}
/* Testa gravação + leitura de uma chave descartável, para diagnosticar
   se o armazenamento persistente está realmente funcionando neste link. */
async function checkStorageHealth(){
  STORAGE_LAST_ERROR = null;
  if(!storageApiPresent()){
    return {ok:false, reason:'unavailable'};
  }
  const probe = String(Date.now());
  const wrote = await storageSetSafe(SK_PING, probe, true);
  if(!wrote){
    return {ok:false, reason:'write-failed', detail: STORAGE_LAST_ERROR};
  }
  const read = await storageGetSafe(SK_PING, true);
  if(read !== probe){
    return {ok:false, reason:'read-mismatch', detail: STORAGE_LAST_ERROR};
  }
  return {ok:true};
}
async function loadSchemaRemote(){
  const raw = await storageGetSafe(SK_SCHEMA, true);
  if(!raw) return null;
  try{ return JSON.parse(raw); }catch(e){ return null; }
}
async function saveSchemaRemote(schema){
  return storageSetSafe(SK_SCHEMA, JSON.stringify(schema), true);
}
async function loadPasscodeRemote(){
  return storageGetSafe(SK_PASSCODE, true);
}
async function savePasscodeRemote(pass){
  return storageSetSafe(SK_PASSCODE, pass, true);
}
async function saveSubmissionRemote(sub){
  return storageSetSafe(SUB_PREFIX + sub.id, JSON.stringify(sub), true);
}
async function listSubmissionsRemote(){
  try{
    const r = await window.storage.list(SUB_PREFIX, true);
    if(!r || !r.keys || !r.keys.length) return [];
    const out = [];
    for(const k of r.keys){
      const raw = await storageGetSafe(k, true);
      if(raw){
        try{ out.push(JSON.parse(raw)); }catch(e){}
      }
    }
    out.sort((a,b)=> (b.createdAt||0) - (a.createdAt||0));
    return out;
  }catch(e){ return []; }
}

function answerFor(qid){
  return state.answers[qid];
}
function ensureAnswer(question){
  const t = question.type;
  if(state.answers[question.id] !== undefined) return state.answers[question.id];
  let v;
  if(t === 'text' || t === 'textarea') v = '';
  else if(t === 'single') v = {choice:null, other:''};
  else if(t === 'multi') v = {choices:[], other:''};
  else if(t === 'grid') v = {cells:{}};
  else v = null;
  state.answers[question.id] = v;
  return v;
}

function showToast(msg){
  state.toast = msg;
  render();
  if(state.toastTimer) clearTimeout(state.toastTimer);
  state.toastTimer = setTimeout(()=>{ state.toast = null; render(); }, 2600);
}

   Renderização de perguntas (formulário do cliente)
--------------------------------------------------------- */
function isAnswerEmpty(question, value){
  if(!value) return true;
  const t = question.type;
  if(t === 'text' || t === 'textarea') return !String(value).trim();
  if(t === 'single'){
    if(!value.choice) return true;
    if(value.choice === '__other__') return !String(value.other||'').trim();
    return false;
  }
  if(t === 'multi'){
    if(!value.choices || !value.choices.length) return true;
    if(value.choices.includes('__other__') && !String(value.other||'').trim()) return true;
    return false;
  }
  if(t === 'grid'){
    if(!value.cells) return true;
    const rows = question.rows || [];
    return rows.some((r,i)=> !value.cells[String(i)]);
  }
  return false;
}

function validateStep(schema, stepIndex){
  const sheet = schema.sheets[stepIndex];
  if(!sheet) return {ok:true};
  for(const qid of sheet.questions){
    const question = schema.questions[qid];
    if(!question || !question.required) continue;
    const val = ensureAnswer(question);
    if(isAnswerEmpty(question, val)){
      return {ok:false, msg:'Há campos obrigatórios não preenchidos nesta prancha.', qid: qid};
    }
  }
  return {ok:true};
}

function formatAnswerDisplay(question, value){
  if(!question) return '';
  const t = question.type;
  if(t === 'text' || t === 'textarea'){
    return value ? String(value).trim() : '';
  }
  if(t === 'single'){
    if(!value || !value.choice) return '';
    if(value.choice === '__other__') return value.other ? ('Outro: ' + value.other) : 'Outro';
    const opt = (question.options||[]).find(o=>o.id===value.choice);
    return opt ? opt.label : '';
  }
  if(t === 'multi'){
    if(!value || !value.choices || !value.choices.length) return '';
    const parts = [];
    value.choices.forEach(cid=>{
      if(cid === '__other__'){
        parts.push(value.other ? ('Outro: ' + value.other) : 'Outro');
      } else {
        const opt = (question.options||[]).find(o=>o.id===cid);
        if(opt) parts.push(opt.label);
      }
    });
    return parts.join(', ');
  }
  if(t === 'grid'){
    if(!value || !value.cells) return '';
    const rows = question.rows || [];
    const parts = [];
    rows.forEach((r,i)=>{
      const c = value.cells[String(i)];
      if(c) parts.push(r + ': ' + c);
    });
    return parts.join(' · ');
  }
  return '';
}

function renderQuestion(question, index){
  const val = ensureAnswer(question);
  let body = '';
  const t = question.type;

  if(t === 'text'){
    body = '<input type="text" class="text-input" data-field-qid="'+question.id+'" value="'+escapeHtml(val)+'" placeholder="Sua resposta">';
  } else if(t === 'textarea'){
    body = '<textarea class="textarea-input" data-field-qid="'+question.id+'" placeholder="Sua resposta">'+escapeHtml(val)+'</textarea>';
  } else if(t === 'single'){
    if(question.visual){
      body = renderVisualOptions(question, val, 'single');
    } else {
      body = '<div class="chips">' + (question.options||[]).map(function(opt){
        const sel = val.choice === opt.id;
        return '<button type="button" class="chip'+(sel?' selected':'')+'" data-act="pick-single" data-qid="'+question.id+'" data-oid="'+opt.id+'">'+escapeHtml(opt.label)+'</button>';
      }).join('') + (question.hasOther ? renderOtherChip(question, val, 'single') : '') + '</div>';
      if(question.hasOther && val.choice === '__other__'){
        body += renderOtherInput(question, val);
      }
    }
  } else if(t === 'multi'){
    if(question.visual){
      body = renderVisualOptions(question, val, 'multi');
    } else {
      body = '<div class="chips">' + (question.options||[]).map(function(opt){
        const sel = (val.choices||[]).includes(opt.id);
        return '<button type="button" class="chip'+(sel?' selected':'')+'" data-act="pick-multi" data-qid="'+question.id+'" data-oid="'+opt.id+'">'+escapeHtml(opt.label)+'</button>';
      }).join('') + (question.hasOther ? renderOtherChip(question, val, 'multi') : '') + '</div>';
    }
    if(question.hasOther && (val.choices||[]).includes('__other__')){
      body += renderOtherInput(question, val);
    }
  } else if(t === 'grid'){
    body = '<div class="grid-q">' + (question.rows||[]).map(function(row, ri){
      const cells = (question.cols||[]).map(function(col){
        const sel = val.cells && val.cells[String(ri)] === col;
        return '<button type="button" class="grow-cell'+(sel?' selected':'')+'" data-act="pick-grid" data-qid="'+question.id+'" data-row="'+ri+'" data-col="'+escapeHtml(col)+'">'+escapeHtml(col)+'</button>';
      }).join('');
      return '<div class="grid-row"><div class="grow-label">'+escapeHtml(row)+'</div><div class="grow-cells">'+cells+'</div></div>';
    }).join('') + '</div>';
  }

  return '<div class="qcard">' +
    '<div class="qlabel"><span class="qn">'+String(index+1).padStart(2,'0')+'</span><span>'+escapeHtml(question.label)+(question.required?'<span class="req">*</span>':'')+'</span></div>' +
    body +
  '</div>';
}

function renderOtherChip(question, val, mode){
  const selected = mode==='single' ? val.choice === '__other__' : (val.choices||[]).includes('__other__');
  const act = mode==='single' ? 'pick-single' : 'pick-multi';
  return '<button type="button" class="chip'+(selected?' selected':'')+'" data-act="'+act+'" data-qid="'+question.id+'" data-oid="__other__">Outro</button>';
}
function renderOtherInput(question, val){
  return '<div class="other-row"><input type="text" class="text-input" data-other-qid="'+question.id+'" value="'+escapeHtml(val.other||'')+'" placeholder="Descreva..."></div>';
}

function renderVisualOptions(question, val, mode){
  const selectedList = mode==='single' ? (val.choice?[val.choice]:[]) : (val.choices||[]);
  const act = mode==='single' ? 'pick-single' : 'pick-multi';
  let cards = (question.options||[]).map(function(opt){
    const sel = selectedList.includes(opt.id);
    let visual;
    if(opt.image){
      visual = '<img class="vphoto" src="'+opt.image+'" alt="">';
    } else if(question.swatchSet && opt.swatch){
      visual = '<div class="swatch-stack">' + opt.swatch.map(c=>'<div style="background:'+c+'"></div>').join('') + '</div>';
    } else if(opt.icon){
      visual = '<div class="vicon">'+iconSvg(opt.icon)+'</div>';
    } else {
      visual = '<div class="vicon">'+iconSvg('flatRoof')+'</div>';
    }
    return '<button type="button" class="visual-card'+(sel?' selected':'')+'" data-act="'+act+'" data-qid="'+question.id+'" data-oid="'+opt.id+'">' +
      '<span class="vcheck"><svg viewBox="0 0 10 10"><path d="M1,5 L4,8 L9,1" stroke="white" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>' +
      visual + '<span class="vlabel">'+escapeHtml(opt.label)+'</span>' +
    '</button>';
  }).join('');
  if(question.hasOther){
    const sel = mode==='single' ? val.choice==='__other__' : (val.choices||[]).includes('__other__');
    cards += '<button type="button" class="visual-card'+(sel?' selected':'')+'" data-act="'+act+'" data-qid="'+question.id+'" data-oid="__other__">' +
      '<span class="vcheck"><svg viewBox="0 0 10 10"><path d="M1,5 L4,8 L9,1" stroke="white" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>' +
      '<div class="vicon">'+iconSvg('paint')+'</div><span class="vlabel">Outro</span>' +
    '</button>';
  }
  let html = '<div class="visual-grid">'+cards+'</div>';
  const otherSelected = mode==='single' ? val.choice==='__other__' : (val.choices||[]).includes('__other__');
  if(question.hasOther && otherSelected){
    html += renderOtherInput(question, val);
  }
  return html;
}

/* ---------------------------------------------------------

--------------------------------------------------------- */
function railHtml(schema, currentStep, totalSteps){
  const items = schema.sheets.map(function(sheet, i){
    const reachable = i <= state.maxStepReached;
    const cls = 'rail-step' + (i===currentStep?' active':'') + (i<currentStep?' done':'') + (reachable?' reachable':'');
    return (i>0?'<div class="rail-line"></div>':'') +
      '<button type="button" class="'+cls+'" '+(reachable?('data-act="wizard-jump" data-step="'+i+'"'):'disabled')+'>' +
        '<span class="num">'+sheet.eyebrow+'</span>' +
      '</button>';
  }).join('');
  const reviewIdx = schema.sheets.length;
  const reviewReachable = reviewIdx <= state.maxStepReached;
  const reviewCls = 'rail-step' + (currentStep===reviewIdx?' active':'') + (reviewReachable?' reachable':'');
  return '<div class="rail">' +
    '<img class="rail-logo" src="'+LOGO_ICON+'" alt="">' +
    '<div class="rail-steps">' + items + '<div class="rail-line"></div>' +
      '<button type="button" class="'+reviewCls+'" '+(reviewReachable?('data-act="wizard-jump" data-step="'+reviewIdx+'"'):'disabled')+'>' +
        '<span class="num">✓</span>' +
      '</button>' +
    '</div>' +
  '</div>';
}

function mobileProgressHtml(schema, currentStep, totalSteps){
  const pct = Math.round(((currentStep+1)/totalSteps)*100);
  const label = currentStep < schema.sheets.length ? ('Prancha '+schema.sheets[currentStep].eyebrow+' de '+String(schema.sheets.length).padStart(2,'0')) : 'Revisão final';
  return '<div class="mobile-progress"><div class="mp-top"><span class="eyebrow">'+label+'</span><span class="eyebrow">'+pct+'%</span></div><div class="bar"><span style="width:'+pct+'%"></span></div></div>';
}

function titleBlockHtml(schema){
  const q1 = state.answers['q1'];
  const q3 = state.answers['q3'];
  const name = q1 ? String(q1).trim() : '';

function renderClientForm(){
  const schema = state.schema;
  const totalSteps = schema.sheets.length + 1;
  const isReview = state.step >= schema.sheets.length;
  let content;
  if(isReview){
    content = renderReviewContent(schema);
  } else {
    const sheet = schema.sheets[state.step];
    const questionsHtml = sheet.questions.map(function(qid, i){
      const question = schema.questions[qid];
      if(!question) return '';
      return renderQuestion(question, i);
    }).join('');
    content = '<div class="sheet-head"><div class="eyebrow">Prancha '+sheet.eyebrow+' / '+String(schema.sheets.length).padStart(2,'0')+'</div><h2 class="display">'+escapeHtml(sheet.title)+'</h2>' +
      (sheet.help?('<div class="sheet-help">'+escapeHtml(sheet.help)+'</div>'):'') +
    '</div>' + questionsHtml;
  }

  const navPrevDisabled = state.step === 0;
  const nextLabel = isReview ? '' : 'Avançar';

  return '<div class="wizard-shell">' +
    railHtml(schema, state.step, totalSteps) +
    '<div class="wizard-main">' +
      mobileProgressHtml(schema, state.step, totalSteps) +
      '<div class="wizard-scroll"><div class="wizard-inner">'+content+'</div></div>' +
      '<div class="wizard-nav">' +
        '<button type="button" class="btn-ghost btn" data-act="wizard-prev" '+(navPrevDisabled?'disabled':'')+'>Voltar</button>' +
        (state.validationMsg ? '<span class="nav-error">'+escapeHtml(state.validationMsg)+'</span>' : '<span class="spacer"></span>') +
        (isReview ?
          '<button type="button" class="btn" data-act="submit-briefing" '+(state.submitting?'disabled':'')+'>'+(state.submitting?'Enviando…':'Enviar respostas')+'</button>' :
          '<button type="button" class="btn" data-act="wizard-next">'+nextLabel+'</button>'
        ) +
      '</div>' +
      titleBlockHtml(schema) +
    '</div>' +
  '</div>';
}

function renderReviewContent(schema){
  const sheetsHtml = schema.sheets.map(function(sheet, si){
    const items = sheet.questions.map(function(qid){
      const question = schema.questions[qid];
      if(!question) return '';
      const val = ensureAnswer(question);
      const text = formatAnswerDisplay(question, val);
      return '<div class="review-item"><div class="ri-q">'+escapeHtml(question.label)+'</div><div class="ri-a'+(text?'':' empty')+'">'+(text?nl2br(text):'Não respondido')+'</div></div>';
    }).join('');
    return '<div class="review-sheet"><div class="rs-head"><h3>'+sheet.eyebrow+' — '+escapeHtml(sheet.title)+'</h3><button type="button" class="btn-text" data-act="wizard-jump" data-step="'+si+'">Editar</button></div>'+items+'</div>';
  }).join('');
  return '<div class="sheet-head"><div class="eyebrow">Revisão final</div><h2 class="display">Confira antes de enviar</h2>' +
    '<div class="sheet-help">Dê uma última olhada nas respostas. Se algo faltou, clique em "Editar" na seção correspondente.</div></div>' +
    sheetsHtml;
}

function submissionToText(sub){
  const schema = sub.schemaSnapshot;
  const name = (sub.meta && sub.meta.clientName) || 'Sem nome';
  const proj = (sub.meta && sub.meta.projectType) || '—';
  let out = 'BRIEFING DE PROJETO — ' + name + '\n' + proj + ' · ' + formatDate(sub.createdAt) + '\n';
  schema.sheets.forEach(function(sheet){
    out += '\n' + sheet.eyebrow + ' — ' + sheet.title + '\n';
    sheet.questions.forEach(function(qid){
      const question = schema.questions[qid];
      if(!question) return;
      const text = formatAnswerDisplay(question, sub.answers[qid]);
      out += '- ' + question.label + ': ' + (text || 'Não respondido') + '\n';
    });
  });
  return out;
}

/* ---------------------------------------------------------
   Editor de perguntas (arquiteto)
--------------------------------------------------------- */
const TYPE_LABELS = {text:'Texto curto', textarea:'Texto longo', single:'Escolha única', multi:'Seleção múltipla', grid:'Grade'};

function isArmed(type, id){ return !!(state.confirmArm && state.confirmArm.type===type && state.confirmArm.id===id); }
function armConfirm(type, id){
  state.confirmArm = {type:type, id:id};
  render();
  if(state.confirmTimer) clearTimeout(state.confirmTimer);
  state.confirmTimer = setTimeout(function(){ state.confirmArm = null; render(); }, 4000);
}
function clearArm(){ state.confirmArm = null; if(state.confirmTimer) clearTimeout(state.confirmTimer); }

function editorUpdateQuestionField(qid, field, value){
  const q = state.editorDraft.questions[qid];
  if(!q) return;
  q[field] = value;
  if(field === 'type'){
    if((value==='single'||value==='multi') && !q.options) q.options = [];
    if(value==='grid'){ if(!q.rows) q.rows=['Item 1']; if(!q.cols) q.cols=['01','02']; }
  }
  render();
}
function editorUpdateOptions(qid, rawText){
  const q = state.editorDraft.questions[qid];
  if(!q) return;
  const lines = rawText.split('\n').map(function(s){return s.trim();}).filter(Boolean);
  const prev = q.options || [];
  q.options = lines.map(function(line, i){
    const p = prev[i];
    return p ? Object.assign({}, p, {label:line}) : {id:uid('o'), label:line};
  });
  render();
}
function editorUpdateGridList(qid, field, rawText){
  const q = state.editorDraft.questions[qid];
  if(!q) return;
  q[field] = rawText.split(',').map(function(s){return s.trim();}).filter(Boolean);
  render();
}
function editorMoveQuestion(sheetId, qid, dir){
  const sheet = state.editorDraft.sheets.find(function(s){return s.id===sheetId;});
  if(!sheet) return;
  const idx = sheet.questions.indexOf(qid);
  const newIdx = idx + dir;
  if(newIdx < 0 || newIdx >= sheet.questions.length) return;
  const tmp = sheet.questions[idx];
  sheet.questions[idx] = sheet.questions[newIdx];
  sheet.questions[newIdx] = tmp;
  render();
}
function editorDeleteQuestion(sheetId, qid){
  const sheet = state.editorDraft.sheets.find(function(s){return s.id===sheetId;});
  if(sheet){
    sheet.questions = sheet.questions.filter(function(q){return q!==qid;});
  }
  delete state.editorDraft.questions[qid];
  clearArm();
  render();
}
function editorAddQuestion(sheetId, label, type){
  if(!label || !label.trim()) return;
  const sheet = state.editorDraft.sheets.find(function(s){return s.id===sheetId;});
  if(!sheet) return;
  const qid = uid('q');
  const q = {id:qid, type:type, label:label.trim(), required:false};
  if(type==='single'||type==='multi'){ q.options = []; q.hasOther = false; }
  if(type==='grid'){ q.rows=['Item 1']; q.cols=['01','02']; }
  state.editorDraft.questions[qid] = q;
  sheet.questions.push(qid);
  state.editorAddOpen[sheetId] = false;
  render();
}
function editorMoveSheet(sheetId, dir){
  const sheets = state.editorDraft.sheets;
  const idx = sheets.findIndex(function(s){return s.id===sheetId;});
  const newIdx = idx + dir;
  if(newIdx < 0 || newIdx >= sheets.length) return;
  const tmp = sheets[idx];
  sheets[idx] = sheets[newIdx];
  sheets[newIdx] = tmp;
  renumberSheets(state.editorDraft);
  render();
}
function renumberSheets(schema){
  schema.sheets.forEach(function(s,i){ s.eyebrow = String(i+1).padStart(2,'0'); });
}
function editorDeleteSheet(sheetId){
  state.editorDraft.sheets = state.editorDraft.sheets.filter(function(s){return s.id!==sheetId;});
  renumberSheets(state.editorDraft);
  clearArm();
  render();
}
function editorAddSheet(title){
  if(!title || !title.trim()) return;
  const s = {id:uid('s'), eyebrow:'00', title:title.trim(), help:'', questions:[]};
  state.editorDraft.sheets.push(s);
  renumberSheets(state.editorDraft);
  state.openSheets[s.id] = true;
  state.editorAddSheetOpen = false;
  render();
}

/* ---------------------------------------------------------
   Dispatcher principal
--------------------------------------------------------- */
function screenHtml(){
  switch(state.screen){
    case 'loading': return '<div class="center-loading">Carregando…</div>';
    case 'landing': return renderLanding();
    case 'client-form': return renderClientForm();
    case 'client-success': return renderClientSuccess();
    case 'admin-gate': return renderAdminGate();
    case 'admin-dashboard': return renderAdminDashboard();
    case 'admin-detail': return renderAdminDetail();
    case 'admin-editor': return renderAdminEditor();
    default: return '<div class="center-loading">—</div>';
  }
}

function render(){
  const app = document.getElementById('app');
  const scroller = app.querySelector('.wizard-scroll');
  const prevScroll = scroller ? scroller.scrollTop : 0;
  app.innerHTML = screenHtml() + (state.toast ? '<div class="toast show">'+escapeHtml(state.toast)+'</div>' : '');
  const newScroller = app.querySelector('.wizard-scroll');
  if(newScroller) newScroller.scrollTop = prevScroll;
}

/* ---------------------------------------------------------
   Navegação do wizard
--------------------------------------------------------- */
function goStep(newStep){
  state.validationMsg = '';
  state.step = newStep;
  if(newStep > state.maxStepReached) state.maxStepReached = newStep;
  window.scrollTo(0,0);
  render();
}
function wizardNext(){
  const check = validateStep(state.schema, state.step);
  if(!check.ok){ state.validationMsg = check.msg; render(); return; }
  state.validationMsg = '';
  goStep(state.step + 1);
}
function wizardPrev(){
  if(state.step === 0) return;
  goStep(state.step - 1);
}
function wizardJump(n){
  if(n > state.maxStepReached) return;
  goStep(n);
}

async function submitBriefing(){
  if(state.submitting) return;
  state.submitting = true; render();
  const schema = state.schema;
  const q1 = state.answers['q1'];
  const q3 = state.answers['q3'];
  const sub = {
    id: uid('sub'),
    createdAt: Date.now(),
    schemaSnapshot: cloneDeep(schema),
    answers: cloneDeep(state.answers),
    meta: {
      clientName: q1 ? String(q1).trim() : '',
      projectType: q3 ? formatAnswerDisplay(schema.questions['q3'], q3) : ''
    }
  };
  // Tenta salvar no painel do arquiteto (melhor esforço — não bloqueia o envio).
  // O e-mail abaixo é o caminho garantido de entrega, então o cliente nunca
  // fica travado por uma eventual instabilidade do armazenamento.
  let stored = await saveSubmissionRemote(sub);
  if(!stored){
    await new Promise(function(res){ setTimeout(res, 900); });
    stored = await saveSubmissionRemote(sub);
  }
  // Envia também para a planilha (Google Sheets via Apps Script), em segundo
  // plano — sem exigir conta do cliente e sem travar a tela de sucesso.
  sendToSheetBestEffort(sub);
  state.submitting = false;
  state.lastSubmission = sub;
  state.lastSubmissionStored = stored;
  state.screen = 'client-success';
  render();
}

function buildSheetPayload(sub){
  const schema = sub.schemaSnapshot;
  const rows = [];
  schema.sheets.forEach(function(sheet){
    sheet.questions.forEach(function(qid){
      const question = schema.questions[qid];
      if(!question) return;
      rows.push({
        prancha: sheet.eyebrow + ' — ' + sheet.title,
        pergunta: question.label,
        resposta: formatAnswerDisplay(question, sub.answers[qid]) || ''
      });
    });
  });
  return {
    id: sub.id,
    enviadoEm: new Date(sub.createdAt).toISOString(),
    cliente: (sub.meta && sub.meta.clientName) || '',
    tipoProjeto: (sub.meta && sub.meta.projectType) || '',
    respostas: rows
  };
}
function sendToSheetBestEffort(sub){
  if(!SHEET_WEBAPP_URL) return;
  try{
    const payload = JSON.stringify(buildSheetPayload(sub));
    const body = new URLSearchParams();
    body.set('payload', payload);
    // Content-Type form-urlencoded evita a checagem de CORS (preflight) que
    // o Apps Script costuma não responder corretamente. Como o Apps Script
    // normalmente não devolve cabeçalhos CORS, a resposta fica "opaca" —
    // por isso este envio é apenas de melhor esforço, sem confirmação.
    fetch(SHEET_WEBAPP_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},
      body: body.toString()
    }).catch(function(){ /* melhor esforço — falha aqui não afeta o cliente */ });
  }catch(e){ /* nunca deixa isso quebrar o envio do cliente */ }
}

function buildMailSubject(sub){
  const name = (sub.meta && sub.meta.clientName) || 'Cliente';
  return 'Briefing de projeto — ' + name;
}
function buildMailBody(sub){
  return submissionToText(sub);
}
function buildMailtoHref(sub){
  const subject = encodeURIComponent(buildMailSubject(sub));
  const body = encodeURIComponent(buildMailBody(sub));
  return 'mailto:' + ARCHITECT_EMAIL + '?subject=' + subject + '&body=' + body;
}

--------------------------------------------------------- */
async function runStorageCheck(){

  render();
  const res = await checkStorageHealth();
  if(res.ok){
    state.storageStatus = 'ok';
    state.storageFailDetail = '';
  } else {
    state.storageStatus = 'fail';
    state.storageFailDetail = res.detail || res.reason || '';
  }
  render();
}

async function enterAdminGate(){
  state.screen = 'admin-gate';
  state.passError = '';
  state.passInput = '';
  render();
}
async function handleAdminPassSubmit(pass1){
  if(pass1 === ADMIN_PASSCODE){
    state.adminAuthed = true;
    await goAdminDashboard();
  } else {
    state.passError = 'Senha incorreta.';
    render();
  }
}
function groupByPrancha(respostas){
  const order = [];
  const map = {};
  (respostas||[]).forEach(function(item){
    const key = item.prancha || 'Respostas';
    if(!map[key]){ map[key] = []; order.push(key); }
    map[key].push(item);
  });
  return order.map(function(key){ return {prancha:key, itens:map[key]}; });
}
function sheetRowToText(row){
  const name = row.cliente || 'Sem nome';
  const proj = row.tipoProjeto || '—';
  let out = 'BRIEFING DE PROJETO — ' + name + '\n' + proj + ' · ' + formatDate(new Date(row.enviadoEm).getTime()) + '\n';
  groupByPrancha(row.respostas).forEach(function(g){
    out += '\n' + g.prancha + '\n';
    g.itens.forEach(function(item){
      out += '- ' + item.pergunta + ': ' + (item.resposta || 'Não respondido') + '\n';
    });
  });
  return out;
}
function downloadJsonFile(filename, dataObj){
  try{
    const blob = new Blob([JSON.stringify(dataObj, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    return true;
  }catch(e){ return false; }
}
async function fetchSheetSubmissions(){
  if(!SHEET_WEBAPP_URL){ return {ok:false, error:'URL da planilha não configurada.'}; }
  try{
    const sep = SHEET_WEBAPP_URL.indexOf('?') > -1 ? '&' : '?';
    const url = SHEET_WEBAPP_URL + sep + 'token=' + encodeURIComponent(ADMIN_PASSCODE);
    const res = await fetch(url, {method:'GET'});
    if(!res.ok){ return {ok:false, error:'HTTP ' + res.status}; }
    const data = await res.json();
    if(data && data.error){ return {ok:false, error:data.error}; }
    if(!Array.isArray(data)){ return {ok:false, error:'Resposta inesperada do servidor.'}; }
    return {ok:true, rows:data};
  }catch(e){
    return {ok:false, error:(e && e.message) ? e.message : String(e)};
  }
}
async function goAdminDashboard(){
  state.screen = 'admin-dashboard';
  state.submissions = null;
  state.sheetFetchStatus = 'loading';
  render();
  const res = await fetchSheetSubmissions();
  if(res.ok){
    state.submissions = res.rows;
    state.sheetFetchStatus = 'ok';
  } else {
    state.submissions = [];
    state.sheetFetchStatus = 'fail';
    state.sheetFetchError = res.error;
  }
  render();
}
async function goAdminEditor(){
  state.editorDraft = cloneDeep(state.schema);
  state.screen = 'admin-editor';
  render();
  runStorageCheck();
}
function adminLogout(){
  state.adminAuthed = false;
  state.screen = 'landing';
  render();
}

async function init(){

/* ---------------------------------------------------------
   Delegação de eventos
--------------------------------------------------------- */
document.addEventListener('click', function(e){
  const t = e.target.closest('[data-act]');
  if(!t) return;
  const act = t.getAttribute('data-act');

  if(act === 'go-client'){
    state.answers = {}; state.step = 0; state.maxStepReached = 0; state.validationMsg='';
    state.screen = 'client-form'; render(); return;
  }
  if(act === 'go-admin'){ enterAdminGate(); return; }
  if(act === 'back-landing'){ state.screen = 'landing'; render(); return; }

  if(act === 'wizard-next'){ wizardNext(); return; }
  if(act === 'wizard-prev'){ wizardPrev(); return; }
  if(act === 'wizard-jump'){ wizardJump(parseInt(t.getAttribute('data-step'),10)); return; }
  if(act === 'submit-briefing'){ submitBriefing(); return; }
  if(act === 'copy-submission'){
    if(state.lastSubmission){
      const text = submissionToText(state.lastSubmission);
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(function(){ showToast('Respostas copiadas.'); }).catch(function(){ showToast('Não foi possível copiar.'); });
      }
    }
    return;
  }

  if(act === 'pick-single'){
    const qid = t.getAttribute('data-qid'), oid = t.getAttribute('data-oid');
    const q = state.schema.questions[qid];
    const val = ensureAnswer(q);
    val.choice = (val.choice === oid) ? null : oid;
    if(val.choice !== '__other__') val.other = val.other; // keep text but not shown
    render(); return;
  }
  if(act === 'pick-multi'){
    const qid = t.getAttribute('data-qid'), oid = t.getAttribute('data-oid');
    const q = state.schema.questions[qid];
    const val = ensureAnswer(q);
    if(!val.choices) val.choices = [];
    const i = val.choices.indexOf(oid);
    if(i>-1) val.choices.splice(i,1); else val.choices.push(oid);
    render(); return;
  }
  if(act === 'pick-grid'){
    const qid = t.getAttribute('data-qid'), row = t.getAttribute('data-row'), col = t.getAttribute('data-col');
    const q = state.schema.questions[qid];
    const val = ensureAnswer(q);
    if(!val.cells) val.cells = {};
    val.cells[row] = (val.cells[row] === col) ? undefined : col;
    if(val.cells[row] === undefined) delete val.cells[row];
    render(); return;
  }

  if(act === 'admin-go-dashboard'){ goAdminDashboard(); return; }
  if(act === 'admin-go-editor'){ goAdminEditor(); return; }
  if(act === 'admin-logout'){ adminLogout(); return; }
  if(act === 'admin-check-storage'){ runStorageCheck(); return; }
  if(act === 'admin-view-sub'){
    const id = t.getAttribute('data-subid');
    state.selectedSub = (state.submissions||[]).find(function(s){return s.id===id;}) || null;
    state.screen = 'admin-detail'; render(); return;
  }
  if(act === 'admin-copy-sub'){
    const sub = state.selectedSub;
    if(sub){
      const text = sheetRowToText(sub);
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(function(){ showToast('Respostas copiadas.'); }).catch(function(){ showToast('Não foi possível copiar.'); });
      }
    }
    return;
  }
  if(act === 'admin-download-sub'){
    const sub = state.selectedSub;
    if(sub){
      const ok = downloadJsonFile('briefing-' + (sub.cliente || 'cliente').toLowerCase().replace(/[^a-z0-9]+/g,'-') + '.json', sub);
      showToast(ok ? 'Download iniciado.' : 'Não foi possível baixar.');
    }
    return;
  }
  if(act === 'admin-download-all'){
    const ok = downloadJsonFile('briefings-recebidos.json', state.submissions || []);
    showToast(ok ? 'Download iniciado.' : 'Não foi possível baixar.');
    return;
  }
  if(act === 'admin-print'){ window.print(); return; }

  if(act === 'editor-toggle-sheet'){
    const sid = t.getAttribute('data-sheet');
    state.openSheets[sid] = !state.openSheets[sid];
    render(); return;
  }
  if(act === 'editor-toggle-addq'){
    const sid = t.getAttribute('data-sheet');
    state.editorAddOpen[sid] = !state.editorAddOpen[sid];
    render(); return;
  }
  if(act === 'editor-add-q'){
    const sid = t.getAttribute('data-sheet');
    const panel = t.closest('.add-panel');
    const labelInput = panel.querySelector('[data-addq-label="'+sid+'"]');
    const typeSelect = panel.querySelector('[data-addq-type="'+sid+'"]');
    editorAddQuestion(sid, labelInput ? labelInput.value : '', typeSelect ? typeSelect.value : 'text');
    return;
  }
  if(act === 'editor-move-q'){
    editorMoveQuestion(t.getAttribute('data-sheet'), t.getAttribute('data-qid'), parseInt(t.getAttribute('data-dir'),10));
    return;
  }
  if(act === 'editor-delete-q'){
    const sid = t.getAttribute('data-sheet'), qid = t.getAttribute('data-qid');
    if(isArmed('question', qid)) editorDeleteQuestion(sid, qid); else armConfirm('question', qid);
    return;
  }
  if(act === 'editor-move-sheet'){
    editorMoveSheet(t.getAttribute('data-sheet'), parseInt(t.getAttribute('data-dir'),10));
    return;
  }
  if(act === 'editor-delete-sheet'){
    const sid = t.getAttribute('data-sheet');
    if(isArmed('sheet', sid)) editorDeleteSheet(sid); else armConfirm('sheet', sid);
    return;
  }
  if(act === 'editor-toggle-addsheet'){
    state.editorAddSheetOpen = !state.editorAddSheetOpen;
    render(); return;
  }
  if(act === 'editor-add-sheet'){
    const input = document.getElementById('new-sheet-title');
    editorAddSheet(input ? input.value : '');
    return;
  }
  if(act === 'editor-save'){
    (async function(){
      const ok = await saveSchemaRemote(state.editorDraft);
      if(ok){
        state.schema = cloneDeep(state.editorDraft);
        state.storageStatus = 'ok';
        showToast('Alterações salvas.');
      } else {
        showToast('Não foi possível salvar — veja o aviso acima.');
        await runStorageCheck();
      }
    })();
    return;
  }
  if(act === 'editor-discard'){
    state.editorDraft = cloneDeep(state.schema);
    showToast('Alterações descartadas.');
    return;
  }
  if(act === 'editor-reset'){
    if(isArmed('reset','schema')){
      state.editorDraft = defaultSchema();
      clearArm();
      showToast('Perguntas padrão restauradas (clique em Salvar para confirmar).');
    } else {
      armConfirm('reset','schema');
    }
    return;
  }
});

document.addEventListener('input', function(e){
  const el = e.target;
  if(el.matches('[data-field-qid]')){
    const qid = el.getAttribute('data-field-qid');
    const q = state.schema.questions[qid];
    const val = ensureAnswer(q);
    state.answers[qid] = el.value;
    if(qid === 'q1'){
      const tb = document.getElementById('tb-name');
      if(tb) tb.innerHTML = '<b>Cliente:</b> ' + escapeHtml(el.value.trim() || '—');
    }
    return;
  }
  if(el.matches('[data-other-qid]')){
    const qid = el.getAttribute('data-other-qid');
    const q = state.schema.questions[qid];
    const val = ensureAnswer(q);
    val.other = el.value;
    return;
  }
  if(el.matches('[data-field="sub-filter"]')){
    state.subFilter = el.value;
    render();
    return;
  }
});

document.addEventListener('change', function(e){
  const el = e.target;
  if(el.matches('[data-editor-label]')){
    editorUpdateQuestionField(el.getAttribute('data-editor-label'), 'label', el.value);
  } else if(el.matches('[data-editor-type]')){
    editorUpdateQuestionField(el.getAttribute('data-editor-type'), 'type', el.value);
  } else if(el.matches('[data-editor-required]')){
    editorUpdateQuestionField(el.getAttribute('data-editor-required'), 'required', el.checked);
  } else if(el.matches('[data-editor-hasother]')){
    editorUpdateQuestionField(el.getAttribute('data-editor-hasother'), 'hasOther', el.checked);
  } else if(el.matches('[data-editor-options]')){
    editorUpdateOptions(el.getAttribute('data-editor-options'), el.value);
  } else if(el.matches('[data-editor-gridrows]')){
    editorUpdateGridList(el.getAttribute('data-editor-gridrows'), 'rows', el.value);
  } else if(el.matches('[data-editor-gridcols]')){
    editorUpdateGridList(el.getAttribute('data-editor-gridcols'), 'cols', el.value);
  } else if(el.matches('[data-editor-sheettitle]')){
    const sid = el.getAttribute('data-editor-sheettitle');
    const sheet = state.editorDraft.sheets.find(function(s){return s.id===sid;});
    if(sheet) sheet.title = el.value;
  }
});

document.addEventListener('submit', function(e){
  const form = e.target.closest('[data-form="admin-pass"]');
  if(form){
    e.preventDefault();
    const pass1 = form.querySelector('[name="pass1"]').value;
    handleAdminPassSubmit(pass1);
  }
});

init();

</script>
</body>
</html>
